<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#3b6cff" />
<!-- 手机浏览器/微信内核对 HTML 缓存很激进：必须禁缓存，否则会一直跑旧版页面（旧版不读服务器数据，会把已填的外包单位显示成“暂无”） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>项目用工日报 · H5</title>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --panel-2: #eef2f8;
    --text: #1f2733; --muted: #6b7785; --border: #e3e8f0;
    --primary: #3b6cff; --primary-soft: #e8efff;
    --danger: #ef4444; --ok: #16a34a; --warn: #f59e0b;
    --shadow: 0 4px 16px rgba(20,40,80,.08); --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #0f141c; --panel: #171e29; --panel-2: #1f2733;
    --text: #e7edf5; --muted: #93a1b3; --border: #2a3340;
    --primary: #5b86ff; --primary-soft: #1c2942;
    --danger: #ff6b6b; --ok: #3ddc84; --warn: #fbbf24;
    --shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }

  /* ---------- 顶部标题栏 ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .iconbtn {
    margin-left: auto; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    width: 38px; height: 38px; border-radius: 11px; cursor: pointer; font-size: 17px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:active { background: var(--panel-2); }

  /* ---------- 主区域（手机视图，最大 560 居中） ---------- */
  main#app { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(88px + env(safe-area-inset-bottom, 0px)); }
  .page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head .sub { color: var(--muted); font-size: 13px; }
  .back { color: var(--primary); font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }

  /* ---------- 卡片（单列） ---------- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card.clickable { cursor: pointer; }
  .card.clickable:active { transform: scale(.99); background: var(--panel-2); }
  .proj-card .bar { height: 6px; border-radius: 6px; margin: -2px 0 10px; }
  .proj-card h3 { margin: 0 0 4px; font-size: 16px; }
  .proj-card p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .proj-card .meta { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .meta-line { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
  .prog { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .prog .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .prog .label { font-size: 12.5px; color: var(--muted); }
  .prog .pct { font-size: 22px; font-weight: 800; color: var(--primary); }
  .prog .track { height: 10px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .prog .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7aa0ff); border-radius: 999px; }
  .prog .sub { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .tag-today { font-size: 11px; background: var(--ok); color: #fff; border-radius: 999px; padding: 1px 7px; margin-left: 6px; font-weight: 700; vertical-align: middle; }
  .date-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .date-row .d-main { min-width: 0; }
  .date-row .d-date { font-size: 16px; font-weight: 700; }
  .date-row .d-week { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .date-row .d-info { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .st { flex-shrink: 0; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 5px 10px; text-align: center; line-height: 1.35; }
  .st-done { background: rgba(22,163,74,.12); color: #16a34a; }
  .st-todo { background: rgba(239,68,68,.10); color: #ef4444; }
  .st-future { background: var(--panel-2); color: var(--muted); }
  .doc-block { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .doc-row { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .doc-row:last-child { border-bottom: none; }
  .doc-row .doc-label { flex: 0 0 72px; font-size: 13px; color: var(--muted); }
  .doc-row .doc-value { flex: 1 1 auto; font-size: 15px; font-weight: 600; color: var(--text); word-break: break-all; }
  .doc-head { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
  .mod-item { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow); }
  .mod-head { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 16px; font-size: 15px; font-weight: 600; color: var(--text); background: transparent; border: none; text-align: left; min-height: 48px; }
  .mod-head:active { background: var(--panel-2); }
  .mod-head .arrow { color: var(--muted); font-size: 16px; font-weight: 400; transition: transform .15s ease; }
  .mod-item.collapsed .arrow { transform: rotate(-90deg); }
  .mod-item.collapsed .mod-body { display: none; }
  .mod-item .mod-body { padding: 4px 14px 12px; border-top: 1px solid var(--border); }
  .mod-item.has-draft > .mod-head { color: var(--ok); }
  .mod-tags { display: inline-flex; align-items: center; gap: 8px; }
  .draft-dot { font-size: 11px; color: var(--ok); font-weight: 700; }
  .mod-draft { margin-top: 10px; width: 100%; }
  .module { scroll-margin-top: 70px; }
  .module > legend { display: flex; align-items: center; cursor: pointer; user-select: none; }
  .module.collapsed .mod-body { display: none; }
  .add-btn { display: inline-flex; align-items: center; margin-left: 8px; padding: 3px 10px; font-size: 12px; font-weight: 700; color: var(--primary); background: rgba(59,108,255,.10); border: 1px solid rgba(59,108,255,.35); border-radius: 999px; vertical-align: middle; }
  .add-btn:active { background: rgba(59,108,255,.22); }
  .btn-more { width: 100%; margin: 10px 0 4px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .pill.warn-pill { background: #fff1e6; color: #d97706; font-weight: 700; }
  .pill.danger-pill { background: #fee2e2; color: #dc2626; font-weight: 700; }
  [data-theme="dark"] .pill.warn-pill { background: #3a2a12; color: #ffcf80; }
  [data-theme="dark"] .pill.danger-pill { background: #3a1518; color: #ff9a9a; }

  /* ---------- 按钮 ---------- */
  .btn { border: none; border-radius: 11px; padding: 12px 16px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--primary); color: #fff; transition: filter .12s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
  .btn:active { filter: brightness(.93); }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .btn.sm { padding: 9px 13px; font-size: 13px; width: auto; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---------- 表单 ---------- */
  fieldset.module { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 4px; margin: 0 0 14px; background: var(--panel); }
  fieldset.module legend { font-weight: 700; font-size: 14px; padding: 0 8px; color: var(--primary); }
  .field { margin-bottom: 12px; }
  .field.hidden { display: none; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field .req { color: var(--danger); }
  .field input[type=text], .field input[type=number], .field input[type=time], .field select, .field textarea {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); color: var(--text); font-size: 16px; font-family: inherit; height: 46px;
  }
  .field textarea { height: auto; min-height: 92px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
  /* 工人名单：下拉 + 列表 + 每人时间 */
  .worker-add { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .worker-add select, .worker-add input { flex: 1 1 120px; min-width: 0; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); color: var(--text); font-size: 15px; font-family: inherit; height: 44px; }
  .worker-add .btn { flex: 0 0 auto; height: 44px; }
  /* 可搜索工人下拉 */
  .ws-wrap { position: relative; flex: 1 1 120px; min-width: 0; }
  .ws-wrap input { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); color: var(--text); font-size: 15px; font-family: inherit; height: 44px; }
  .ws-wrap input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
  .ws-dropdown { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 80; max-height: 240px; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  /* display:flex 会覆盖 [hidden] 的 display:none，必须显式声明，否则下拉收不起来 */
  .ws-dropdown[hidden] { display: none; }
  .ws-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 15px; color: var(--text); cursor: pointer; }
  .ws-item:active, .ws-item:hover { background: var(--primary-soft); }
  .ws-item.on { background: var(--primary-soft); font-weight: 600; }
  .ws-item .ws-box { flex: 0 0 auto; width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; color: transparent; }
  .ws-item.on .ws-box { background: var(--primary); border-color: var(--primary); color: #fff; }
  .ws-item .ws-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-empty { padding: 12px; font-size: 13px; color: var(--muted); text-align: center; }
  /* 已选工人（多选）小标签 */
  .ws-picked { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .ws-picked[hidden] { display: none; }
  .ws-picked .ws-picked-label { font-size: 13px; color: var(--muted); }
  .ws-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 13px; font-weight: 600; }
  .ws-chip button { border: 0; padding: 0; background: transparent; color: var(--primary); font-size: 13px; line-height: 1; cursor: pointer; }
  .worker-list { display: flex; flex-direction: column; gap: 8px; }
  .worker-row { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .field .worker-row input.wname { width: auto; flex: 1 1 90px; min-width: 0; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 14px; font-weight: 600; font-family: inherit; height: 38px; }
  .field .worker-row .wtime { width: 78px; flex: 0 0 auto; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 13px; font-family: inherit; height: 38px; }
  .worker-row .wsep { color: var(--muted); flex: 0 0 auto; }
  .worker-row .wrm { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--danger); font-size: 15px; line-height: 1; }
  .worker-row .wnum { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .worker-count { flex: 0 0 auto; margin-left: auto; align-self: center; font-size: 13px; font-weight: 600; color: var(--primary); }
  .worker-empty { font-size: 13px; color: var(--muted); padding: 8px 2px; }
  /* 外包单位（动态添加套数） */
  .sub-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .sub-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--panel-2); }
  .sub-card-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--text); }
  .sub-card input.sname { margin-bottom: 8px; }
  .sub-shifts { display: flex; flex-direction: column; gap: 8px; }
  .sub-shift { border: 1px dashed var(--border); border-radius: 8px; padding: 8px; background: var(--panel); }
  .sub-shift .ss-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .sub-shift .ss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .sub-shift .ss-full { grid-column: 1 / -1; }
  .sub-shift label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field .sub-shift input, .field .sub-shift select { padding: 8px; height: 38px; font-size: 14px; }
  .f2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .entry-card { border-left: 4px solid var(--primary); }
  .entry-card .who { font-weight: 700; font-size: 15px; }
  .entry-card .line { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .entry-card .actions { margin-top: 10px; display: flex; gap: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; font-size: 14px; }

  /* ---------- 统计卡片（2 列） ---------- */
  .stat-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  .stat .n { font-size: 24px; font-weight: 800; color: var(--primary); }
  .stat .l { font-size: 12px; color: var(--muted); }

  /* ---------- 表格（横向滚动） ---------- */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 8px; border-radius: 12px; box-shadow: var(--shadow); background: var(--panel); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); font-size: 13px; min-width: 460px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: var(--panel-2); font-weight: 700; color: var(--muted); position: sticky; top: 0; }
  tbody tr:active { background: var(--panel-2); }
  td.total { font-weight: 800; color: var(--primary); }

  /* ---------- 排行图 ---------- */
  .bar-chart { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-row .name { width: 84px; font-size: 13px; font-weight: 600; text-align: right; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: var(--panel-2); border-radius: 8px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7aa0ff); border-radius: 8px; }
  .bar-row .val { width: 64px; font-size: 13px; font-weight: 700; }

  .section-title { font-size: 16px; font-weight: 800; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .cond-note { background: var(--primary-soft); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 10px;
    font-weight: 600; font-size: 14px; box-shadow: var(--shadow); z-index: 999; opacity: 0;
    transition: opacity .25s, transform .25s; pointer-events: none; max-width: 80%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  /* ---------- 防盗刷：滑块验证 ---------- */
  .vbar { margin: 4px 0 2px; }
  .vtrack { position: relative; height: 44px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; touch-action: none; }
  .vfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--primary), #7aa0ff); }
  .vhandle { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 999px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: grab; user-select: none; box-shadow: 0 2px 6px rgba(0,0,0,.15); z-index: 2; touch-action: none; }
  .vhandle:active { cursor: grabbing; }
  .vtext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); pointer-events: none; }
  .vbar.ok .vhandle { background: var(--ok); color: #fff; }
  .vbar.ok .vfill { background: var(--ok); }
  .vbar.ok .vtext { color: #fff; }
  .vbadge { font-size: 11px; background: var(--ok); color: #fff; border-radius: 999px; padding: 2px 8px; margin-left: 8px; font-weight: 700; }
  /* 蜜罐字段（对真人隐藏，对机器人可见） */
  .hp { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }

  /* ---------- 防盗刷：锁定遮罩 ---------- */
  .lock { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
  .lock .ico { font-size: 54px; }
  .lock h2 { margin: 14px 0 6px; font-size: 20px; }
  .lock p { color: var(--muted); max-width: 320px; line-height: 1.7; font-size: 14px; }
  .lock .tip { margin-top: 18px; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; max-width: 320px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand"><span class="dot"></span> 用工日报</div>
  <button class="iconbtn" id="themeBtn" title="切换主题">🌗</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<!-- 防盗刷：链接无效/过期时覆盖全屏 -->
<div class="lock" id="lockScreen" style="display:none">
  <div class="ico">🔒</div>
  <h2 id="lockTitle">链接不可用</h2>
  <p id="lockMsg"></p>
  <div class="tip">如需生成有效链接，请使用同目录下的 <b>sign.html</b> 签发工具，设置有效期后分享生成的链接。</div>
</div>

<script>
/* =========================================================================
   防盗刷配置（⚠️ 与 sign.html 共用，请改成你自己的密钥，且两边保持一致）
   -------------------------------------------------------------------------
   链接格式：index.html?exp=<到期时间戳毫秒>&sig=<HMAC签名>&to=<可选接收人>
   页面加载时校验签名与有效期，失败则展示锁定遮罩，无法填写。
   ========================================================================= */
const SHARE_SECRET = "LILIANG_SURVEY_SECRET_2026_CHANGE_ME";

/* ---------- 纯 JS HMAC-SHA256（无依赖，file:// 也可用） ---------- */
function utf8Bytes(str) {
  const out = [];
  for (let i = 0; i < str.length; i++) {
    let c = str.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
    else if (c >= 0xd800 && c <= 0xdbff) {
      const c2 = str.charCodeAt(++i);

// 校验当前链接签名与有效期
// 签名 payload = exp + '|' + to + '|' + ids + '|' + pathname（与 PC 端 share.js、后端 /api/h5/projects 一致）
function verifyLink() {
  const params = new URLSearchParams(location.search);
  const exp = parseInt(params.get('exp') || '0', 10);
  const sig = params.get('sig') || '';
  const to  = params.get('to') || '';
  const ids = params.get('ids') || '';
  if (!sig || (exp !== 0 && !exp)) return { ok: false, reason: 'missing' };
  if (exp !== 0 && Date.now() > exp) return { ok: false, reason: 'expired' }; // exp=0 = 长期有效
  const payload = exp + '|' + to + '|' + ids + '|' + location.pathname;
  const expect = hmacSHA256(SHARE_SECRET, payload);
  if (expect !== sig) return { ok: false, reason: 'bad' };
  return { ok: true, exp, sig, to, ids };
}

async function syncServerReportToLocal(pid, date) {
  const detail = await fetchH5Report(pid, date);

      id: detail.id ? String(detail.id) : uid(),
      projectId: pid, date,
      fields: serverDetailToFields(detail, pid),
      createdAt: Date.now(), updatedAt: detail.updatedAt || "",
    };
    if (i >= 0) data.entries[i] = entry; else data.entries.push(entry);

    data.entries.splice(i, 1);

async function syncServerReports(pid) {
  const list = await fetchH5Reports(pid);
  data.entries = (data.entries || []).filter(e => String(e.projectId) !== String(pid));

}

/* ---------- 防盗刷：人机滑块验证状态 ---------- */
let humanVerified = false;
function verifyBarHtml() {
  if (humanVerified) {
    return `<div class="vbar ok" id="vbar"><div class="vtrack"><div class="vfill" id="vfill" style="width:100%"></div><div class="vhandle" id="vhandle">✓</div></div><div class="vtext" id="vtext">已通过人机验证</div></div>`;
  }
  return `<div class="vbar" id="vbar"><div class="vtrack" id="vtrack"><div class="vfill" id="vfill"></div><div class="vhandle" id="vhandle">→</div></div><div class="vtext" id="vtext">请按住滑块拖动到最右侧完成验证</div></div>`;
}
function insertVerifyBar(form) {
  const row = form.querySelector('.row');
  if (row) row.insertAdjacentHTML('beforebegin', verifyBarHtml() + `<div class="hp" aria-hidden="true"><input type="text" name="hp_url" tabindex="-1" autocomplete="off" /></div>`);
  initSlider();
}
function initSlider() {
  const bar = document.getElementById('vbar');
  if (!bar || humanVerified) return;
  const track = document.getElementById('vtrack');
  const handle = document.getElementById('vhandle');
  const fill = document.getElementById('vfill');
  const text = document.getElementById('vtext');
  let dragging = false, startX = 0, startLeft = 0;
  const max = () => track.clientWidth - handle.clientWidth;
  function move(x) {
    let left = Math.max(0, Math.min(max(), startLeft + (x - startX)));
    handle.style.left = left + 'px';
    fill.style.width = left + 'px';
    if (left >= max() - 2) success();
  }
  function success() {
    dragging = false;
    humanVerified = true;
    bar.classList.add('ok');
    handle.style.left = max() + 'px';
    fill.style.width = '100%';
    handle.textContent = '✓';
    text.textContent = '已通过人机验证';
  }
  handle.addEventListener('pointerdown', e => { dragging = true; startX = e.clientX; startLeft = parseFloat(handle.style.left || '0'); try { handle.setPointerCapture(e.pointerId); } catch (err) {} });
  handle.addEventListener('pointermove', e => { if (dragging) move(e.clientX); });
  handle.addEventListener('pointerup', () => { if (dragging) { dragging = false; if (!humanVerified) { handle.style.left = '0px'; fill.style.width = '0px'; } } });
  handle.addEventListener('pointercancel', () => { dragging = false; handle.style.left = '0px'; fill.style.width = '0px'; });
}

/* ---------- 防盗刷：设备提交频控（防刷接口/防重复提交） ---------- */
const SUBMIT_COOLDOWN_MS = 2000;   // 同设备两次提交最小间隔
const SUBMIT_DAILY_LIMIT = 60;     // 同设备每日提交上限
function checkSubmitQuota() {
  try {
    const key = 'worklog_submit_log_v1';
    let log = JSON.parse(localStorage.getItem(key) || '[]');
    const today = new Date().toDateString();
    log = log.filter(t => { try { return new Date(t).toDateString() === today; } catch (e) { return false; } });
    if (log.length >= SUBMIT_DAILY_LIMIT) return { ok: false, limit: true };
    const last = log.length ? log[log.length - 1] : 0;
    if (Date.now() - last < SUBMIT_COOLDOWN_MS) return { ok: false, fast: true };
    log.push(Date.now());
    localStorage.setItem(key, JSON.stringify(log));
    return { ok: true };
  } catch (e) { return { ok: true }; }
}

  "张伟", "李娜", "王强", "赵敏", "陈晨", "刘洋", "孙磊", "周涛", "吴昊", "郑凯",
  "冯磊", "蒋勇", "韩雪", "杨帆", "朱军", "秦海", "许文", "何斌", "吕波", "施俊"
];
let REMOTE_WORKERS = []; // 从系统「人员管理」拉取的人员 [{id,name,jobType}]
// 解析工人名单：兼容旧的「逗号分隔字符串」与新的「[{name,start,end}...]」JSON 结构
function workerRows(v) {
  if (!v) return [];
  if (typeof v === "string") {
    if (v.charAt(0) === "[") { try { const a = JSON.parse(v); if (Array.isArray(a)) return a; } catch (e) {} }
    return parseNames(v).map(n => ({ name: n, start: "", end: "" }));
  }
  return Array.isArray(v) ? v : [];
}
let formReadOnly = false; // 已提交后整页只读：数据展示在框里，隐藏暂存/提交/添加等按钮
let currentWorkers = []; // 当前表单的工人列表（含每人开始/结束时间）
let selectedWorkerNames = []; // 搜索下拉已选工人（支持多选，按勾选顺序）
let currentSubs = []; // 当前表单的外包单位列表 [{name, day, eve, dawn}]
function subList(v) { // 解析外包单位数据（兼容空值与 JSON 字符串）
  if (!v) return [];
  if (Array.isArray(v)) return v;
  try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
const SHIFTS = [
  { key: "day",  label: "白天", count: "dayCount"  },
  { key: "eve",  label: "晚上", count: "eveCount"  },
  { key: "dawn", label: "凌晨", count: "dawnCount" },
];

/* ============================ 路由 ============================ */
function router() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  // 手机端滚动到顶部，避免底部 tab 跳页后残留滚动位置
  window.scrollTo(0, 0);
  if (parts.length === 0) return renderHome();
  if (parts[0] === "project") {
    if (parts[2] === "date") return renderDate(parts[1], decodeURIComponent(parts[3]));
    return renderProject(parts[1]);
  }
  if (parts[0] === "stats") return renderStats();
  return renderHome();
}
window.addEventListener("hashchange", router);

/* ============================ 页面：首页（项目列表） ============================ */
function entryHours(e) { // 单条记录的总工数（按人数计：每有一名用工=1 工）
  let h = 0;
  SHIFTS.forEach(s => { const cnt = num(e.fields[s.count]); if (cnt > 0) h += cnt; });
  return h;
}
function entryHeads(e) { // 单条记录的总用工人数（按三班次人数累加）
  let n = 0;
  SHIFTS.forEach(s => { n += num(e.fields[s.count]); });
  return n;
}
async function renderHome() {
  const app = document.getElementById("app");
  // 进入首页即按服务器数据刷新本机记录，保证后台修改后立即可见（不读本机缓存）
  await Promise.all(PROJECTS.map(p => syncServerReports(p.id)));
  const cards = PROJECTS.map(p => {
    const es = data.entries.filter(e => e.projectId === p.id);
    const dates = new Set(es.map(e => e.date)).size;
    const hours = es.reduce((s, e) => s + entryHours(e), 0);
    const heads = es.reduce((s, e) => s + entryHeads(e), 0);
    let statusTag = "";
    if (p.start && p.end) {
      const total = daysBetween(p.start, p.end) + 1;
      const offset = daysBetween(p.start, todayStr());
      if (offset < 0) statusTag = `<span class="pill">未开始</span>`;
      else if (offset > total - 1) statusTag = `<span class="pill">已结束</span>`;
      else {
        const rem = total - (offset + 1);
        if (rem <= 0) statusTag = `<span class="pill">已到期</span>`;
        else if (rem <= 7) statusTag = `<span class="pill danger-pill">🔴 仅剩 ${rem} 天</span>`;
        else if (rem <= 15) statusTag = `<span class="pill warn-pill">⚠ 仅剩 ${rem} 天</span>`;
        else statusTag = `<span class="pill">剩 ${rem} 天</span>`;
      }
    }
    return `<div class="card clickable proj-card" onclick="location.hash='#/project/${p.id}'">
      <div class="bar" style="background:${p.color}"></div>
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.desc)}</p>
      <div class="meta-line">🗓 ${esc(p.start || "—")} ~ ${esc(p.end || "—")}</div>
      <div class="meta">
        ${statusTag}
        <span class="pill">📅 ${dates} 天</span>
        <span class="pill">👷 ${heads} 人次</span>
        <span class="pill">⏱ ${hours.toFixed(1)} 工</span>
      </div>
    </div>`;
  }).join("");
  app.innerHTML = `
    <div class="page-head">
      <div><h1>项目列表</h1><div class="sub">选择项目 → 选择日期 → 分模块填写用工日报</div></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="seedSample()">示例</button>
      <button class="btn ghost sm" onclick="clearAll()">清空</button>
    </div>
    <div class="card clickable proj-card" style="text-align:center" onclick="location.hash='#/stats'">
      <h3>📊 工时统计</h3>
      <p>查看每个人 / 每个项目的工作时间汇总与排行</p>
    </div>
    ${cards}`;
}

/* ============================ 页面：项目 → 日期列表 ============================ */
async function renderProject(pid) {
  const p = projById(pid);
  const app = document.getElementById("app");
  // 进入项目页即从服务器刷新本项目的日报记录（不读本机缓存）
  await syncServerReports(pid);
  const es = data.entries.filter(e => e.projectId === pid);
  const byDate = {};
  es.forEach(e => {
    byDate[e.date] = byDate[e.date] || { count: 0, hours: 0, heads: 0, owners: new Set() };
    byDate[e.date].count++;
    byDate[e.date].hours += entryHours(e);
    byDate[e.date].heads += entryHeads(e);
    if (e.fields.owner) byDate[e.date].owners.add(e.fields.owner);
  });
  const dates = Object.keys(byDate).sort();
  const totalHours = es.reduce((s, e) => s + entryHours(e), 0);

  // 生成项目周期内的完整日期列表（有起止时间用周期，否则用已填日期+今天）
  let allDates = [];
  if (p.start && p.end) {
    const total = daysBetween(p.start, p.end) + 1;
    for (let i = 0; i < Math.min(total, 400); i++) {
      const dt = new Date(p.start + "T00:00:00");
      dt.setDate(dt.getDate() + i);
      allDates.push(todayStrOf(dt));
    }
    allDates.sort();
  } else {
    allDates = [...new Set([...dates, todayStr()])].sort();
  }
  const filledDays = dates.length;
  const fillPct = allDates.length ? Math.round(filledDays / allDates.length * 100) : 0;

  const WEEKS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const dateCards = allDates.map((d, idx) => {
    const info = byDate[d];
    const filled = !!info;
    const dt = new Date(d + "T00:00:00");
    const week = WEEKS[dt.getDay()];
    const today = d === todayStr();
    const past = d < todayStr();
    let st;
    if (filled) st = `<span class="st st-done">已填 ${info.count} 单<br>${info.hours.toFixed(1)} 工</span>`;
    else if (today) st = `<span class="st st-todo">今天未填<br>点击填写</span>`;
    else if (past) st = `<span class="st st-todo">未填写</span>`;
    else st = `<span class="st st-future">未到</span>`;
    const hide = idx >= 15 ? ' style="display:none" class="card clickable date-row older"' : ' class="card clickable date-row"';
    return `<div ${hide} onclick="location.hash='#/project/${pid}/date/${encodeURIComponent(d)}'">
      <div class="d-main">
        <span class="d-date">${esc(d.slice(5))}</span><span class="d-week">${week}</span>${today ? '<span class="tag-today">今天</span>' : ''}
        <button class="add-btn" onclick="event.stopPropagation();location.hash='#/project/${pid}/date/${encodeURIComponent(d)}'">${filled ? "查看" : "＋ 添加"}</button>
        <div class="d-info">${filled ? `负责人：${esc([...info.owners].join("、") || "—")} · 用工 ${info.heads} 人` : "尚未填写日报"}</div>
      </div>
      ${st}
    </div>`;
  }).join("");

  const olderCount = Math.max(0, allDates.length - 15);
  const moreBtn = olderCount > 0 ? `<button class="btn ghost sm btn-more" onclick="document.querySelectorAll('.older').forEach(e=>e.style.display='flex');this.style.display='none'">展开更多日期（${olderCount} 天）</button>` : "";

  // 项目时间进度提示
  let progHtml = "";
  if (p.start && p.end) {
    const total = daysBetween(p.start, p.end) + 1;
    const offset = daysBetween(p.start, todayStr());
    let dayNo, pct, status;
    if (offset < 0) { dayNo = 0; pct = 0; status = "未开始"; }
    else if (offset > total - 1) { dayNo = total; pct = 100; status = "已结束"; }
    else { dayNo = offset + 1; pct = Math.min(100, Math.round(offset / Math.max(1, total - 1) * 100)); status = "进行中"; }
    const remain = Math.max(0, total - dayNo);
    progHtml = `<div class="prog">
      <div class="top"><span class="label">项目周期 ${esc(p.start)} ~ ${esc(p.end)}</span><span class="pct">${pct}%</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="sub">${status} · 第 ${dayNo} / 共 ${total} 天${remain > 0 ? " · 还剩 " + remain + " 天" : " · 已到期"}</div>
    </div>`;
  } else {
    progHtml = `<div class="prog"><div class="sub">未设置项目起止时间（在 PROJECTS 中为该项目补充 start / end 即可显示进度）</div></div>`;
  }

  app.innerHTML = `
    <div class="page-head">
      <a class="back" href="#/">← 返回</a>
      <div><h1 style="color:${p.color}">${esc(p.name)}</h1>
      <div class="sub">${esc(p.desc)} · 累计 ${totalHours.toFixed(1)} 工</div></div>
    </div>
    ${progHtml}
    <div class="prog">
      <div class="top"><span class="label">填写进度（已填 ${filledDays} / 共 ${allDates.length} 天）</span><span class="pct">${fillPct}%</span></div>
      <div class="track"><div class="fill" style="width:${fillPct}%"></div></div>
    </div>
    <div class="section-title">📅 日期列表（右侧为填写状态）</div>
    ${dateCards}
    ${moreBtn}`;
}

/* ============================ 页面：日期 → 模块化问卷 + 记录 ============================ */
async function renderDate(pid, date) {
  const p = projById(pid);
  const app = document.getElementById("app");
  await mergeServerDrafts(pid, date); // 先合并服务器上的模块暂存（换手机/清缓存后仍可回填）
  await syncServerReportToLocal(pid, date); // 关键：展示前用服务器该天数据覆盖本机，保证后台修改可见（不读缓存）
  const entries = data.entries.filter(e => e.projectId === pid && e.date === date)
                              .sort((a, b) => b.createdAt - a.createdAt);

  const editing = editingEntryId ? data.entries.find(e => e.id === editingEntryId) : null;
  const submitted = !editing && entries.length > 0; // 当天已提交：只读展示，不再出现暂存/提交按钮
  const displayEntry = editing || entries[0] || null;

  app.innerHTML = `
    <div class="page-head">
      <a class="back" href="#/project/${pid}">← 返回</a>
      <div><h1>📆 ${esc(date)}</h1>
      <div class="sub">${esc(p.name)} · 项目名称/日期自动带出，按模块填写</div></div>
    </div>
    <div class="card" style="margin-bottom:22px">
      <div class="section-title" style="margin-top:0">${editing ? "✏️ 编辑日报（" + esc(editing.fields.docNo || "") + "）" : submitted ? "📄 查看日报" : "📝 填写用工日报问卷"}</div>
      <form id="qForm" onsubmit="return submitForm(event,'${pid}','${date}')">
        ${renderFormFields(displayEntry, pid, date, submitted)}
        ${submitted ? "" : `<div class="row" style="margin-top:6px">
          <button class="btn" type="submit">${editing ? "保存修改" : "提交日报"}</button>
          ${editing ? `<button class="btn ghost" type="button" onclick="cancelEdit('${pid}','${date}')">取消</button>` : ""}
        </div>`}
      </form>
    </div>`;

  const form = document.getElementById("qForm");
  if (form) {
    form.addEventListener("change", () => updateCond(form));
    updateCond(form);
    if (!submitted) insertVerifyBar(form); // 已提交只读态不需要人机验证滑块
  }
  renderWorkerList(); // 渲染已选工人列表（含每人开始/结束时间）
  renderWorkerPicked(); // 渲染搜索下拉里已勾选（待添加）的工人标签
  renderSubList(); // 渲染外包单位列表（动态套数）
}

function renderFormFields(entry, pid, date, readOnly) {
  const f = entry ? entry.fields : {};
  formReadOnly = !!readOnly; // 只读态：控件禁用、按钮全部隐藏，数据原样展示在框里
  const draft = (pid && date && !formReadOnly) ? getDraft(pid, date) : null;
  if (!entry && draft) Object.values(draft).forEach(m => Object.assign(f, m)); // 未提交时自动回填草稿

  function fieldHtml(fld) {
    const val = f[fld.key] != null ? f[fld.key] : "";
    const condAttr = fld.showIf ? ` data-cond-key="${fld.showIf.key}" data-cond-val="${esc(fld.showIf.val)}"` : "";
    let ctrl = "";
    const req = fld.required && !formReadOnly ? " required" : "";
    const dis = formReadOnly ? " disabled" : "";
    if (fld.type === "textarea") {
      ctrl = `<textarea name="${fld.key}"${req}${dis}>${esc(val)}</textarea>`;
    } else if (fld.type === "select") {
      ctrl = `<select name="${fld.key}"${req}${dis}><option value="">请选择</option>` +
        fld.options.map(o => `<option value="${esc(o)}"${val === o ? " selected" : ""}>${esc(o)}</option>`).join("") + `</select>`;
    } else if (fld.type === "number") {
      ctrl = `<input type="number" name="${fld.key}" min="${fld.min != null ? fld.min : 0}" step="1" value="${esc(val)}" inputmode="numeric"${req}${dis} />`;
    } else if (fld.type === "time") {
      ctrl = `<input type="time" name="${fld.key}" value="${esc(val)}"${dis} />`;
    } else if (fld.type === "workers") {
      currentWorkers = workerRows(val); // 初始化当前工人列表
      selectedWorkerNames = []; // 重置搜索下拉已选项（多选）
      // 候选优先用系统「人员管理」名单（含拼音字段），拉取失败回退内置名单（仅支持姓名匹配）
      ctrl = formReadOnly ? `
          <div id="workerList" class="worker-list"></div>
          <input type="hidden" name="${fld.key}" id="${fld.key}_hidden" value="${esc(JSON.stringify(currentWorkers))}" />` : `
          <div class="worker-add">
            <select id="pendingStart" aria-label="开始时间">${hourOpts("")}</select>
            <span class="wsep">~</span>
            <select id="pendingEnd" aria-label="结束时间">${hourOpts("")}</select>
            <span id="workerCount" class="worker-count">已添加 0 人</span>
          </div>
          <div id="workerPicked" class="ws-picked" hidden></div>
          <div class="worker-add">
            <div class="ws-wrap">
              <input id="workerSearch" type="text" placeholder="搜索：姓名 / 拼音 / 首字母（可多选）" autocomplete="off"
                oninput="openWorkerDropdown()" onfocus="openWorkerDropdown()"
                onkeydown="workerSearchKeydown(event)" />
              <div id="workerDropdown" class="ws-dropdown" hidden></div>
            </div>
            <button type="button" class="btn sm" onclick="addFromWorkerInputs()">添加</button>
          </div>
          <div id="workerList" class="worker-list"></div>
          <input type="hidden" name="${fld.key}" id="${fld.key}_hidden" value="${esc(JSON.stringify(currentWorkers))}" />`;
    } else if (fld.type === "subs") {
      currentSubs = subList(val);
      // 兼容旧版通用加班时段：归入白班（与后端/管理端口径一致）
      currentSubs.forEach(s => {
        if (!s.dayOtStart && !s.dayOtEnd && (s.otStart || s.otEnd)) {
          s.dayOtStart = s.otStart || ""; s.dayOtEnd = s.otEnd || "";
        }
      });
      if (!currentSubs.length && (f.sub1Name || f.sub2Name || f.sub3Name)) { // 兼容旧版固定3套数据
        [1, 2, 3].forEach(n => {
          if (f["sub" + n + "Name"] || f["sub" + n + "Day"] || f["sub" + n + "Eve"] || f["sub" + n + "Dawn"])
            currentSubs.push({ name: f["sub" + n + "Name"] || "", day: f["sub" + n + "Day"] || "", eve: f["sub" + n + "Eve"] || "", dawn: f["sub" + n + "Dawn"] || "" });
        });
      }
      ctrl = `
          <div id="subList" class="sub-list"></div>
          ${formReadOnly ? "" : `<button type="button" class="btn ghost sm" onclick="addSubRow()">＋ 添加外包单位</button>`}
          <input type="hidden" name="${fld.key}" id="${fld.key}_hidden" value="${esc(JSON.stringify(currentSubs))}" />`;
    } else { // text
      ctrl = `<input type="text" name="${fld.key}" value="${esc(val)}" placeholder="${esc(fld.ph || "")}"${req} />`;
    }
    const note = fld.showIf ? `<div class="cond-note">ℹ️ 选择「${esc(fld.showIf.val)}」后显示（同飞书表单条件逻辑）</div>` : "";
    const labelHtml = fld.label ? `<label>${esc(fld.label)}${fld.required ? ' <span class="req">*</span>' : ""}</label>` : "";
    return `<div class="field"${condAttr}>${labelHtml}${ctrl}${note}</div>`;
  }

  // 顶部固定「单据信息」块：只读展示，数据来自创建项目时填写的内容，不可编辑
  const proj = projById(pid);
  const pinnedHtml = `<div class="doc-block"><div class="doc-head">🧾 单据信息</div>
      <div class="doc-row"><span class="doc-label">单据编号</span><span class="doc-value">${esc(proj.docNo || "—")}</span></div>
      <div class="doc-row"><span class="doc-label">负责人</span><span class="doc-value">${esc(proj.owner || "—")}</span></div>
      <div class="doc-row"><span class="doc-label">公司名称</span><span class="doc-value">${esc(proj.company || "—")}</span></div>
    </div>`;

  // 其余模块为可折叠手风琴（点击标题展开/收起，底部带「暂存本模块」；已提交只读态按钮不渲染）
  const collapsibleHtml = QUESTIONNAIRE.modules.filter(m => !m.pinned).map(m => {
    const fields = m.fields.map(fieldHtml).join("");
    const hasDraft = !formReadOnly && draft && draft[m.key];
    const draftBtn = formReadOnly ? "" : `<button type="button" class="btn ghost sm mod-draft" onclick="saveModuleDraft('${pid}','${date}','${m.key}')">⏸ 暂存本模块</button>`;
    return `<div class="mod-item${hasDraft ? " has-draft" : ""}" id="mod-${m.key}"><button type="button" class="mod-head" onclick="toggleMod('${m.key}')"><span>${m.icon} ${esc(m.title.slice(2))}</span><span class="mod-tags"><span class="draft-dot"${hasDraft ? "" : " style=\"display:none\""}>● 已暂存</span><span class="arrow">▾</span></span></button><div class="mod-body">${fields}${draftBtn}</div></div>`;
  }).join("");

  return pinnedHtml + collapsibleHtml;
}
function toggleMod(key) {
  const el = document.getElementById("mod-" + key);
  if (el) el.classList.toggle("collapsed");
}
function updateCond(form) {
  form.querySelectorAll("[data-cond-key]").forEach(w => {
    const ctl = form.elements[w.dataset.condKey];
    const show = !!ctl && ctl.value === w.dataset.condVal;
    w.classList.toggle("hidden", !show);
    w.querySelectorAll("input,select,textarea").forEach(el => el.disabled = !show);
  });
}

/* ============================ 工人名单（下拉 + 列表 + 每人开始/结束时间） ============================ */
function hourOpts(selected) { // 时间只选「时」不选「分」（值固定为 HH:00）；历史精确到分的旧数据保留原值可选
  let html = `<option value=""${selected ? "" : " selected"}>--</option>`;
  for (let h = 0; h < 24; h++) {
    const hh = String(h).padStart(2, "0"), v = hh + ":00";
    html += `<option value="${v}"${selected === v ? " selected" : ""}>${hh}</option>`;
  }
  if (selected && !/^([01]\\d|2[0-3]):00$/.test(selected))
    html += `<option value="${esc(selected)}" selected>${esc(selected)}</option>`;
  return html;
}
function workerRowNo(i) { // 列表倒序展示（最新在最上），序号按添加顺序递增：最上面一行序号最大
  return currentWorkers.length - i;
}
function workerTimeError(w, i, suffix) { // 校验单行工人的姓名与起止时间；返回空串表示通过
  const no = workerRowNo(i);
  const who = w.name ? `工人「${w.name}」` : `第 ${no} 行工人`;
  if (!w.name) return `第 ${no} 行工人未填姓名${suffix || ""}`;
  if (!w.start && !w.end) return `${who}的开始和结束时间未填${suffix || ""}`;
  if (!w.start) return `${who}的开始时间未填${suffix || ""}`;
  if (!w.end) return `${who}的结束时间未填${suffix || ""}`;

function workerCandidates() {

function clearPendingTimeInputs() { // 用完顶部起止时间后清空，避免残留到下一人
  const s = document.getElementById("pendingStart"), e = document.getElementById("pendingEnd");

function addFromWorkerInputs() {
  const input = document.getElementById("workerSearch");
  const typed = ((input && input.value) || "").trim();
  // 已勾选的多人 + 输入框内容与候选完全一致时的兜底姓名
  const names = selectedWorkerNames.slice();
  if (typed && !names.includes(typed) && workerCandidates().some(c => c.name === typed)) names.push(typed);
  const s = document.getElementById("pendingStart"), e = document.getElementById("pendingEnd");
  const st = (s && s.value) || "", en = (e && e.value) || "";
  if (!names.length) { toast("请先搜索并选择工人姓名（可多选）"); return; }
  if (!st || !en) { toast("请先选择开始时间和结束时间"); return; }
  if (en <= st) { toast("结束时间不能小于开始时间"); return; }
  const dup = [], added = [];
  names.forEach(name => {
    // 同名 + 同时间段视为重复添加，跳过
    if (currentWorkers.some(w => w.name === name && w.start === st && w.end === en)) { dup.push(name); return; }

    added.push(name);

  closeWorkerDropdown();
  renderWorkerPicked();
  renderWorkerList();
  const skipped = dup.length ? `（${dup.join("、")} 已存在已跳过）` : "";

/* ============================ 模块暂存（草稿） ============================ */
function draftKey(pid, date) { return pid + "__" + date; }

function h5AuthQS(extra) { // 与 fetchSharedProjects / fetchH5Workers 相同的签名参数
  const qs = new URLSearchParams({
    exp: String(SHARE_AUTH.exp), sig: SHARE_AUTH.sig, to: SHARE_AUTH.to || '', ids: SHARE_AUTH.ids || '', path: location.pathname,
  });
  if (extra) Object.keys(extra).forEach(k => qs.set(k, extra[k]));
  return qs.toString();
}
// 从服务器拉取该项目当天的模块暂存并合并到本地（服务器为准），失败时静默使用本机草稿
async function mergeServerDrafts(pid, date) {
  if (!SHARE_AUTH) return;
  try {
    const r = await fetch('/api/h5/report-drafts?' + h5AuthQS({ projectId: pid, reportDate: date }));
    if (!r.ok) return;
    const list = await r.json();
    if (!Array.isArray(list) || !list.length) return;
    data.drafts = data.drafts || {};
    const dk = draftKey(pid, date);
    data.drafts[dk] = data.drafts[dk] || {};
    list.forEach(d => { if (d && d.moduleKey && d.data) data.drafts[dk][d.moduleKey] = d.data; });
    saveData(data);
  } catch (e) { /* 拉取失败时使用本机草稿 */ }
}
// 暂存入库：同项目同日期同模块有则更新、无则新增（失败保留本机草稿并提示）
async function syncModuleDraftToServer(pid, date, modKey, values) {
  if (!SHARE_AUTH) return;
  try {
    const r = await fetch('/api/h5/report-draft?' + h5AuthQS(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ projectId: Number(pid), reportDate: date, moduleKey: modKey, data: values }),
    });
    if (!r.ok) toast('已暂存本机，但保存到服务器失败');
  } catch (e) { toast('已暂存本机，但保存到服务器失败'); }
}
function getDraft(pid, date) {
  data.drafts = data.drafts || {};
  return data.drafts[draftKey(pid, date)] || null;
}

  return o;
}
function pendingTimeWarning() { // 选了时间但还没添加工人时的提示；空串表示无问题
  const s = document.getElementById("pendingStart"), e = document.getElementById("pendingEnd");

  const form = document.getElementById("qForm");

  if (!mod) return;
  // 工人名单模块：暂存前校验选了时间没加工人、以及每行姓名与起止时间
  if (mod.fields.some(fl => fl.type === "workers")) {

async function submitForm(ev, pid, date) {
  ev.preventDefault();
  // ---- 防盗刷：人机验证 + 蜜罐 + 频控 ----
  if (!humanVerified) { toast("请先拖动滑块完成人机验证"); return false; }
  const form = document.getElementById("qForm");
  const hp = form.querySelector('input[name=hp_url]');
  if (hp && hp.value.trim() !== "") { toast("提交被拦截"); return false; }

  const fd = new FormData(form);
  const fields = {};
  let ok = true, miss = [];
  QUESTIONNAIRE.modules.forEach(m => m.fields.forEach(fld => {
    if (fld.type === "workers") { fields[fld.key] = JSON.stringify(currentWorkers); return; }
    if (fld.type === "subs") { fields[fld.key] = JSON.stringify(currentSubs); return; }
    let v = fd.get(fld.key); v = v == null ? "" : String(v).trim();
    if (fld.type === "number") v = v === "" ? "" : num(v);
    fields[fld.key] = v;
    if (fld.required && v === "") { ok = false; miss.push(fld.label); }
  }));
  if (!ok) { toast("请填写必填项：" + miss.join("、")); return false; }

  // 工人名单：校验每行姓名与起止时间（结束必须大于开始）
  if (QUESTIONNAIRE.modules.some(m => m.fields.some(f => f.type === "workers"))) {
    const warn = pendingTimeWarning();
    if (warn) { toast(warn); return false; }
    for (let i = 0; i < currentWorkers.length; i++) {
      const err = workerTimeError(currentWorkers[i], i, "，请补全");
      if (err) { toast(err); return false; }
    }
  }

  // 外包单位：后端按「单位名称」落库，名称为空的行会被丢弃，因此提交前必须拦住，否则填了人数也看不到
  if (fields.outsourced === OUT || fields.outsourced === "是") {
    const badIdx = (currentSubs || []).findIndex(s => !String(s.name || "").trim());
    if (badIdx >= 0) { toast(`第 ${badIdx + 1} 个外包单位未填名称，请补全或删除后再提交`); return false; }
  }

  // 防盗刷：提交频控（蜜罐已通过、必填已填才计次）
  const quota = checkSubmitQuota();
  if (!quota.ok) { toast(quota.fast ? "操作过于频繁，请稍后再试" : "今日提交次数已达上限，请明日再填"); return false; }

  const curProj = projById(pid); // 单据信息来自项目，随提交自动带出
  fields.docNo = curProj.docNo || "";
  fields.owner = curProj.owner || "";
  fields.company = curProj.company || "";

  const isEdit = !!editingEntryId;
  // 直接写入服务器，不再把数据存本机缓存；提交后以服务器为准重新拉取展示
  const uploadOk = await uploadReportToServer(pid, date, fields);
  editingEntryId = null;
  clearDraft(pid, date);
  if (!uploadOk) {
    toast("上报失败，请检查网络后重试（已保留当前填写内容）");
    return false;
  }
  toast(isEdit ? "已保存修改" : "提交成功");
  router(); // 重新渲染：重新从服务器拉取，已提交则展示只读「查看」
  return false;
}

    .filter(w => w.name);
  const subs = (currentSubs || []).map(s => {
    const o = {
      name: (s.name || "").trim(),
      day: num(s.day), eve: num(s.eve), dawn: num(s.dawn),
    };
    SUB_SHIFT_DEFS.forEach(d => {
      o[d.key + "Ot"] = num(s[d.key + "Ot"]);
      o[d.key + "OtStart"] = s[d.key + "OtStart"] || "";
      o[d.key + "OtEnd"] = s[d.key + "OtEnd"] || "";
    });
    return o;
  }).filter(s => s.name);
  const payload = {
    projectId: Number(pid),
    reportDate: date,
    workers,
    shifts: { day: num(fields.dayCount), eve: num(fields.eveCount), dawn: num(fields.dawnCount) },
    meals: {
      breakfast: num(fields.breakfast), lunch: num(fields.lunch),
      dinner: num(fields.dinner), supper: num(fields.supper), water: 0,
    },
    equipment: {
      fork3: { day: num(fields.fork3), eve: 0, dawn: 0 },
      fork5: { day: num(fields.fork5), eve: 0, dawn: 0 },
      crane: { day: num(fields.crane), eve: 0, dawn: 0 },
      rescue: { day: num(fields.rescue), eve: 0, dawn: 0 },
    },
    outsourced: fields.outsourced === OUT || fields.outsourced === "是",
    outsourcing: subs,
    notes: fields.notes || "",
  };
  try {
    const r = await fetch('/api/h5/report?' + h5AuthQS(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      let msg = '上传服务器失败';
      try { const e = await r.json(); if (e && e.error) msg += '：' + e.error; } catch (e) {}
      toast(msg);
      return false;
    }
    return true;
  } catch (e) {
    toast('网络异常，上传服务器失败');
    return false;
  }
}
function editEntry(id) { editingEntryId = id; const e = data.entries.find(x => x.id === id); location.hash = `#/project/${e.projectId}/date/${encodeURIComponent(e.date)}`; }
function cancelEdit(pid, date) { editingEntryId = null; location.hash = `#/project/${pid}/date/${encodeURIComponent(date)}`; }
async function delEntry(id) {
  if (!confirm("确定删除这条日报？")) return;
  const e = data.entries.find(x => x.id === id);
  if (e) {
    try {
      const r = await fetch('/api/h5/report/' + encodeURIComponent(id) + '?' + h5AuthQS(), { method: 'DELETE' });
      if (!r.ok) toast('删除服务器数据失败，仅移除本机记录');
    } catch (err) { toast('删除服务器数据失败，仅移除本机记录'); }
  }
  data.entries = data.entries.filter(x => x.id !== id);
  saveData(data); router(); toast("已删除");
}

/* ============================ 统计 ============================ */
// 每个工人的工时：按「工人名单」计（每出现一次=1 工，跨项目汇总）
function computeWorkerStats() {
  const res = {};
  data.entries.forEach(e => {
    workerRows(e.fields.workNames).forEach(w => {
      res[w.name] = res[w.name] || {};
      res[w.name][e.projectId] = (res[w.name][e.projectId] || 0) + 1;
    });
  });
  return res;
}
// 每个负责人：单据数 / 用工人日 / 总人时
function computeOwnerStats() {
  const res = {};
  data.entries.forEach(e => {
    const o = e.fields.owner || "未填负责人";
    res[o] = res[o] || { docs: 0, heads: 0, hours: 0 };
    res[o].docs++;
    res[o].heads += entryHeads(e);
    res[o].hours += entryHours(e);
  });
  return res;
}
function renderStats() {
  const app = document.getElementById("app");
  if (!data.entries.length) {
    app.innerHTML = `<div class="page-head"><h1>工时统计</h1></div>
      <div class="empty">暂无数据。请先填写日报，或在项目页点「示例」。</div>`;
    return;
  }
  const es = data.entries;
  const totalHours = es.reduce((s, e) => s + entryHours(e), 0);
  const totalHeads = es.reduce((s, e) => s + entryHeads(e), 0);
  const wStats = computeWorkerStats();
  const workers = Object.keys(wStats).sort((a, b) => {
    const ta = Object.values(wStats[a]).reduce((x, y) => x + y, 0);
    const tb = Object.values(wStats[b]).reduce((x, y) => x + y, 0);
    return tb - ta;
  });
  const oStats = computeOwnerStats();
  const owners = Object.keys(oStats).sort((a, b) => oStats[b].hours - oStats[a].hours);

  // 负责人表
  const ownerRows = owners.map(o => `<tr><td>${esc(o)}</td><td>${oStats[o].docs}</td><td>${oStats[o].heads}</td><td class="total">${oStats[o].hours.toFixed(1)}</td></tr>`).join("");
  const ownerTotal = owners.reduce((s, o) => s + oStats[o].hours, 0);

  // 工人 × 项目 表
  const projHead = PROJECTS.map(p => `<th>${esc(p.name)}</th>`).join("");
  const workerRows = workers.map(w => {
    const cells = PROJECTS.map(p => { const v = wStats[w][p.id]; return `<td>${v ? v.toFixed(1) : "—"}</td>`; }).join("");
    const t = Object.values(wStats[w]).reduce((x, y) => x + y, 0);
    return `<tr><td>${esc(w)}</td>${cells}<td class="total">${t.toFixed(1)}</td></tr>`;
  }).join("");
  const wColTotal = PROJECTS.map(p => {
    const s = es.reduce((a, e) => {
      if (e.projectId !== p.id) return a;
      return a + workerRows(e.fields.workNames).length;
    }, 0);
    return `<td class="total">${s.toFixed(1)}</td>`;
  }).join("");

  // 排行图
  const maxH = Math.max(...workers.map(w => Object.values(wStats[w]).reduce((x, y) => x + y, 0)), 1);
  const bars = workers.slice(0, 12).map(w => {
    const t = Object.values(wStats[w]).reduce((x, y) => x + y, 0);
    return `<div class="bar-row"><div class="name">${esc(w)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(t / maxH * 100).toFixed(1)}%"></div></div>
      <div class="val">${t.toFixed(1)} h</div></div>`;
  }).join("");

  app.innerHTML = `
    <div class="page-head">
      <div><h1>工时统计</h1>
      <div class="sub">工人工时 = 出现在各班次名单中的次数（跨项目汇总，每出现一次记 1 工）</div></div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <button class="btn ghost sm" onclick="exportCSV()">⬇ 日报明细</button>
      <button class="btn ghost sm" onclick="exportWorkerCSV()">⬇ 工人工时</button>
    </div>
    <div class="stat-cards">
      <div class="stat"><div class="n">${es.length}</div><div class="l">日报单数</div></div>
      <div class="stat"><div class="n">${totalHeads}</div><div class="l">用工总人次</div></div>
      <div class="stat"><div class="n">${totalHours.toFixed(1)}</div><div class="l">总工数（人·工）</div></div>
      <div class="stat"><div class="n">${workers.length}</div><div class="l">参与工人（去重）</div></div>
    </div>

    <div class="section-title">👤 每个工人的工作时间（小时，按项目拆分）</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>工人</th>${projHead}<th>合计</th></tr></thead>
        <tbody>${workerRows}
          <tr style="font-weight:800;background:var(--panel-2)"><td>项目小计</td>${wColTotal}<td class="total">${totalHours.toFixed(1)}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="section-title">📊 工人用工排行（Top ${Math.min(workers.length, 12)}）</div>
    <div class="bar-chart">${bars}</div>

    <div class="section-title">🧑‍💼 按负责人汇总</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>负责人</th><th>日报单数</th><th>用工人次</th><th>总工数</th></tr></thead>
        <tbody>${ownerRows}
          <tr style="font-weight:800;background:var(--panel-2)"><td>合计</td><td>${es.length}</td><td>${totalHeads}</td><td class="total">${ownerTotal.toFixed(1)}</td></tr>
        </tbody>
      </table>
    </div>`;
}

/* ============================ 导出 ============================ */
function csvOf(rows) {
  return rows.map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
}
function downloadCSV(name, rows) {
  const blob = new Blob(["\uFEFF" + csvOf(rows)], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  toast("已导出 " + name);
}
function exportCSV() {
  const head = ["项目", "日期", "单据编号", "负责人", "公司名称", "工人名单",
    "白天人数", "晚上人数", "凌晨人数",
    "早餐人数", "午餐人数", "晚餐人数", "夜宵人数",
    "是否外包", "外包单位（白天/晚上/凌晨）",
    "叉车1吨", "叉车3吨", "叉车5吨", "吊车", "救援车", "备注", "合计工数", "提交时间"];
  const rows = data.entries.map(e => {
    const f = e.fields, p = projById(e.projectId);
    const wr = workerRows(f.workNames).map(w => w.name + (w.start ? " " + w.start + (w.end ? "~" + w.end : "") : "")).join("、");
    const subsTxt = subList(f.subs).map((s, i) => {
      const ot = SUB_SHIFT_DEFS.map(d => {
        const st = s[d.key + "OtStart"], en = s[d.key + "OtEnd"], n = num(s[d.key + "Ot"]);
        if (!st && !en && !n) return null;
        return `${d.label}班加班${st || "?"}~${en || "?"}${n ? "x" + n + "人" : ""}`;
      }).filter(Boolean).join("，");
      return `${s.name || "单位" + (i + 1)}(白${num(s.day)}/晚${num(s.eve)}/凌${num(s.dawn)})${ot ? " " + ot : ""}`;
    }).join("；");
    return [p.name, e.date, f.docNo || "", f.owner || "", f.company || "", wr,
      f.dayCount, f.eveCount, f.dawnCount,
      f.breakfast, f.lunch, f.dinner, f.supper,
      f.outsourced, subsTxt,
      f.fork1, f.fork3, f.fork5, f.crane, f.rescue, f.notes, entryHours(e).toFixed(1),
      new Date(e.createdAt).toLocaleString("zh-CN")];
  });
  downloadCSV("用工日报明细_" + todayStr() + ".csv", [head, ...rows]);
}
function exportWorkerCSV() {
  const wStats = computeWorkerStats();
  const head = ["工人", ...PROJECTS.map(p => p.name), "合计（小时）"];
  const rows = Object.keys(wStats).map(w => {
    const t = Object.values(wStats[w]).reduce((x, y) => x + y, 0);
    return [w, ...PROJECTS.map(p => wStats[w][p.id] ? wStats[w][p.id].toFixed(1) : ""), t.toFixed(1)];
  });
  downloadCSV("工人工时统计_" + todayStr() + ".csv", [head, ...rows]);
}

/* ============================ 示例 / 清空 ============================ */
function seedSample() {
  const workers = ["张伟", "李娜", "王强", "赵敏", "陈晨", "刘洋", "孙磊"];
  const owners = ["王建国", "刘志明"];
  const sample = [];
  for (let i = 0; i < 10; i++) {
    const p = PROJECTS[i % PROJECTS.length];
    const ds = new Date(Date.now() - (i % 6) * 86400000).toISOString().slice(0, 10);
    const n = 2 + (i % 3);
    const names = workers.slice(i % 3, (i % 3) + n);
    sample.push({
      id: uid(), projectId: p.id, date: ds, createdAt: Date.now() - i * 1000,
      fields: {
        docNo: "BG" + (1000 + i), owner: owners[i % owners.length], company: "××建设有限公司",
        workNames: JSON.stringify(names.map(nm => ({ name: nm, start: "08:00", end: "17:00" }))),
        dayCount: n, breakfast: n, lunch: n,
        eveCount: i % 3 === 0 ? 2 : "", dinner: i % 3 === 0 ? 2 : "",
        dawnCount: "", supper: "",
        outsourced: i % 4 === 0 ? "是" : "否",
        subs: i % 4 === 0 ? [{ name: "××外包公司", day: 3, eve: "", dawn: "" }] : [],
        fork1: i % 2, fork3: i % 3 === 0 ? 1 : "", fork5: "", crane: i % 5 === 0 ? 1 : "", rescue: "", notes: i % 5 === 0 ? "示例：需协调吊装配合" : "",
      }
    });
  }
  data.entries = data.entries.concat(sample);
  saveData(data); router(); toast("已载入示例数据");
}
function clearAll() {
  if (!confirm("确定清空本机所有数据？此操作不可恢复。")) return;
  data = { entries: [] }; saveData(data); router(); toast("已清空");
}

/* ============================ 主题 ============================ */
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("worklog_theme", next); } catch (e) {}
});
(function initTheme() {
  try {
    const t = localStorage.getItem("worklog_theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();

/* ============================ 启动（含防盗刷校验） ============================ */
async function boot() {
  // 防 iframe 嵌套：被嵌入时尝试跳出框架
  if (window.self !== window.top) {
    try { window.top.location.href = window.location.href; } catch (e) { document.body.innerHTML = '<p style="padding:20px">禁止在框架中打开本页面</p>'; }
    return;
  }
  const res = verifyLink();
  if (!res.ok) { showLock(res.reason); return; }
  SHARE_AUTH = res; // 暂存接口复用该签名参数
  const shared = await fetchSharedProjects(res); // 项目列表来自后端
  if (shared && shared.length) PROJECTS = shared;
  await fetchH5Workers(res); // 人员管理名单来自后端（失败回退内置名单）
  showVerifiedBadge(res);
  router();
}
boot();
